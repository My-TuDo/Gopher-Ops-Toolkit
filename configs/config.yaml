
health:   # 健康检查配置：不输入参数时默认为 tcp 探测。
    type: all # 探测类型，默认为 all。
    timeout: 5s # 探测超时时间，默认为 5s.
    target: "localhost:8080"

    targets: 
        tcp: "localhost:8080"  # 探测目标地址，默认为 localhost:8080。
        http: "http://localhost:8080"  # 探测目标地址，默认为 http://localhost:8080。

        dns: "baidu.com"  # 探测目标地址，本地探测。

    





